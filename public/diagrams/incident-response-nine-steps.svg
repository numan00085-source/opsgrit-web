<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 446" width="714" height="446" role="img" aria-labelledby="t d" font-family="Inter,Segoe UI,Arial,sans-serif">
<title id="t">Incident response: nine steps</title><desc id="d">Detect, triage, declare, contain, diagnose, communicate, restore, close and review.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6240"/></marker></defs>
<rect width="714" height="446" rx="16" fill="#fffaf0"/>
<text x="28" y="32" font-size="15" font-weight="800" fill="#1f2430">Incident response: nine steps</text>
<rect x="28.0" y="58" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="123.0" y="104.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">1. Detect and report</text>
<rect x="262.0" y="58" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="357.0" y="104.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">2. Triage and classify</text>
<line x1="220.0" y1="100.0" x2="260.0" y2="100.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="496.0" y="58" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="591.0" y="96.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">3. Declare and</text><text x="591.0" y="113.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">assemble</text>
<line x1="454.0" y1="100.0" x2="494.0" y2="100.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="28.0" y="186" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="123.0" y="232.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">4. Contain</text>
<rect x="262.0" y="186" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="357.0" y="232.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">5. Diagnose and fix</text>
<line x1="220.0" y1="228.0" x2="260.0" y2="228.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="496.0" y="186" width="190" height="84" rx="12" fill="#fbf3d6" stroke="#b8901f" stroke-width="1.6"/><text x="591.0" y="224.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">6. Communicate</text><text x="591.0" y="241.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">throughout</text>
<line x1="454.0" y1="228.0" x2="494.0" y2="228.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="28.0" y="314" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="123.0" y="360.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">7. Restore and verify</text>
<rect x="262.0" y="314" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="357.0" y="360.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">8. Close and hand off</text>
<line x1="220.0" y1="356.0" x2="260.0" y2="356.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="496.0" y="314" width="190" height="84" rx="12" fill="#fbf3d6" stroke="#b8901f" stroke-width="1.6"/><text x="591.0" y="352.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">9. Review</text><text x="591.0" y="369.0" text-anchor="middle" font-size="12" fill="#4a5163">Blameless, with actions</text>
<line x1="454.0" y1="356.0" x2="494.0" y2="356.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
