<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 714 318" width="714" height="318" role="img" aria-labelledby="t d" font-family="Inter,Segoe UI,Arial,sans-serif">
<title id="t">Tool migration: four gated phases</title><desc id="d">Assess, prepare, parallel-run and cutover, each ending in a recorded go or no-go decision, followed by decommissioning.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6240"/></marker></defs>
<rect width="714" height="318" rx="16" fill="#fffaf0"/>
<text x="28" y="32" font-size="15" font-weight="800" fill="#1f2430">Tool migration: four gated phases</text>
<rect x="28.0" y="58" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="123.0" y="87.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">Assess</text><text x="123.0" y="104.5" text-anchor="middle" font-size="12" fill="#4a5163">Inventory and system of</text><text x="123.0" y="121.5" text-anchor="middle" font-size="12" fill="#4a5163">record</text>
<rect x="262.0" y="58" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="357.0" y="87.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">Prepare</text><text x="357.0" y="104.5" text-anchor="middle" font-size="12" fill="#4a5163">Mapping, sandbox, rollback</text><text x="357.0" y="121.5" text-anchor="middle" font-size="12" fill="#4a5163">triggers</text>
<line x1="220.0" y1="100.0" x2="260.0" y2="100.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="496.0" y="58" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="591.0" y="96.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">Parallel-run</text><text x="591.0" y="113.0" text-anchor="middle" font-size="12" fill="#4a5163">Old tool stays authoritative</text>
<line x1="454.0" y1="100.0" x2="494.0" y2="100.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="145.0" y="186" width="190" height="84" rx="12" fill="#fbf3d6" stroke="#b8901f" stroke-width="1.6"/><text x="240.0" y="215.5" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">Cutover</text><text x="240.0" y="232.5" text-anchor="middle" font-size="12" fill="#4a5163">Freeze window and</text><text x="240.0" y="249.5" text-anchor="middle" font-size="12" fill="#4a5163">verification</text>
<rect x="379.0" y="186" width="190" height="84" rx="12" fill="#ffffff" stroke="#8a7a4a" stroke-width="1.6"/><text x="474.0" y="224.0" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2430">Decommission</text><text x="474.0" y="241.0" text-anchor="middle" font-size="12" fill="#4a5163">Only after stable running</text>
<line x1="337.0" y1="228.0" x2="377.0" y2="228.0" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
<path d="M591.0 144 V164.0 H240.0 V184" fill="none" stroke="#6b6240" stroke-width="1.8" marker-end="url(#ah)"/>
</svg>